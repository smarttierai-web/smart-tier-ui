<svg width="100%" height="100%" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="smarttier-logo-svg">
  <style>
    .smarttier-logo-svg {
      overflow: visible;
    }
    .logo-base-path {
      stroke: #10B981;
      stroke-width: 4.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.85;
    }
    .logo-glow-path {
      stroke: #34D399;
      stroke-width: 7px;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.45;
      animation: pulseGlow 2.5s ease-in-out infinite alternate;
    }
    .logo-laser-path {
      stroke: #F0FDF4;
      stroke-width: 3.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 45 105;
      stroke-dashoffset: 150;
      animation: traceLaser 3s linear infinite;
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; filter: drop-shadow(0 0 2px #10B981); }
      100% { opacity: 0.8; filter: drop-shadow(0 0 8px #34D399); }
    }
    @keyframes traceLaser {
      from { stroke-dashoffset: 150; }
      to { stroke-dashoffset: 0; }
    }
    .shield-left {
      fill: #1E293B;
      transition: fill 0.3s;
    }
    .shield-right {
      fill: #0F172A;
      transition: fill 0.3s;
    }
    .smarttier-logo-svg:hover .shield-left {
      fill: #334155;
    }
    .smarttier-logo-svg:hover .shield-right {
      fill: #1E293B;
    }
  </style>

  <!-- Outer Beveled Shield (Left Half) -->
  <g class="outer-shield-left">
    <path class="shield-left" d="M 50 10 L 18 50 L 36 50 L 50 25 Z" />
    <path class="shield-left" d="M 18 50 L 50 90 L 50 75 L 36 50 Z" />
  </g>

  <!-- Outer Beveled Shield (Right Half) -->
  <g class="outer-shield-right">
    <path class="shield-right" d="M 50 10 L 82 50 L 64 50 L 50 25 Z" />
    <path class="shield-right" d="M 82 50 L 50 90 L 50 75 L 64 50 Z" />
  </g>

  <!-- Inner Glowing Loop (Base Path) -->
  <path class="logo-base-path" d="M 48 38 C 46 32, 44 28, 44 28 C 56 28, 64 38, 64 50 C 64 62, 56 72, 56 72 C 44 72, 36 62, 36 50 C 36 38, 44 28, 44 28 C 44 28, 51 41, 54 48" />

  <!-- Inner Glowing Loop (Glow Overlay) -->
  <path class="logo-glow-path" d="M 48 38 C 46 32, 44 28, 44 28 C 56 28, 64 38, 64 50 C 64 62, 56 72, 56 72 C 44 72, 36 62, 36 50 C 36 38, 44 28, 44 28 C 44 28, 51 41, 54 48" />

  <!-- Inner Glowing Loop (Laser Core Trace) -->
  <path class="logo-laser-path" d="M 48 38 C 46 32, 44 28, 44 28 C 56 28, 64 38, 64 50 C 64 62, 56 72, 56 72 C 44 72, 36 62, 36 50 C 36 38, 44 28, 44 28 C 44 28, 51 41, 54 48" />
</svg>
